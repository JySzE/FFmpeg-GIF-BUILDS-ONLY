name: FFmpeg GIF-only build with libass

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit to build (optional)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            yasm \
            pkg-config \
            libass-dev \
            libfreetype6-dev

      - name: Configure FFmpeg
        run: |
          ./configure \
            --disable-encoders \
            --disable-muxers \
            --disable-devices \
            --disable-filters \
            --enable-gpl \
            --enable-libass \
            --enable-filter=scale,fps,palettegen,paletteuse,subtitles \
            --enable-encoder=gif \
            --enable-muxer=gif,image2 \
            --enable-demuxer=ass,ssa \
            --enable-parser=ass

      - name: Build
        run: |
          make -j"$(nproc)"

      - name: Verify build
        run: |
          ./ffmpeg -hide_banner -version | head -n 20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-gif-libass
          path: ./ffmpeg
