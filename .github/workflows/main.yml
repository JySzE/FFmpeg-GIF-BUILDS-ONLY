name: FFmpeg Windows GIF build with libass + release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit to build (optional)"
        required: false
        default: ""

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            gcc
            make
            nasm
            pkg-config
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-pcre2

      - name: Verify libass is installed and visible to pkg-config
        shell: msys2 {0}
        run: |
          echo "PATH=$PATH"
          pacman -Q mingw-w64-x86_64-libass || true
          ls /mingw64/lib/pkgconfig | grep libass || true
          pkg-config --modversion libass || true
          pkg-config --list-all | grep -i libass || true

      - name: Configure FFmpeg
        shell: msys2 {0}
        env:
          PKG_CONFIG_PATH: /mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          PKG_CONFIG_LIBDIR: /mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          PATH: /mingw64/bin:/usr/bin:$PATH
        run: |
          cd "$GITHUB_WORKSPACE"
          ./configure \
            --arch=x86_64 \
            --target-os=mingw32 \
            --enable-gpl \
            --enable-libass \
            --enable-ffmpeg \
            --enable-ffprobe \
            --disable-doc \
            --disable-ffplay \
            --disable-debug \
            --enable-static \
            --disable-shared \
            --enable-encoder=gif \
            --enable-muxer=gif,image2 \
            --enable-filter=scale,fps,palettegen,paletteuse,subtitles \
            --enable-demuxer=ass,ssa \
            --enable-parser=ass \
            --enable-protocol=file

      - name: Build
        shell: msys2 {0}
        env:
          PKG_CONFIG_PATH: /mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          PKG_CONFIG_LIBDIR: /mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          PATH: /mingw64/bin:/usr/bin:$PATH
        run: |
          cd "$GITHUB_WORKSPACE"
          make -j"$(nproc)"

      - name: Verify output
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          ls -l ffmpeg.exe ffprobe.exe
          ./ffmpeg.exe -hide_banner -version | head -n 20
          ./ffprobe.exe -hide_banner -version | head -n 20

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ffmpeg-gif-win-${{ github.run_number }}
          name: FFmpeg Windows GIF ${{ github.run_number }}
          files: |
            ffmpeg.exe
            ffprobe.exe
