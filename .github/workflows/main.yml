name: FFmpeg Windows static GIF exporter build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit to build (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          suppress-deprecation-warnings: true
          install: >-
            base-devel
            git
            make
            gcc
            nasm
            pkg-config
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-libass
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-pcre2

      - name: Verify toolchain and static libs
        shell: msys2 {0}
        run: |
          which x86_64-w64-mingw32-gcc
          x86_64-w64-mingw32-gcc --version
          pkg-config --modversion libass
          ls /ucrt64/lib | grep libass || true
          ls /ucrt64/lib | grep "libass.*\\.a" || true

      - name: Configure FFmpeg static build
        shell: msys2 {0}
        env:
          PKG_CONFIG: /ucrt64/bin/pkg-config
          PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
          PKG_CONFIG_LIBDIR: /ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /ucrt64
          CPPFLAGS: -I/ucrt64/include
          LDFLAGS: -L/ucrt64/lib -static -static-libgcc -static-libstdc++
          PATH: /ucrt64/bin:/usr/bin:$PATH
        run: |
          cd "$GITHUB_WORKSPACE"
          ./configure \
            --arch=x86_64 \
            --target-os=mingw32 \
            --enable-gpl \
            --enable-libass \
            --enable-ffmpeg \
            --enable-ffprobe \
            --disable-doc \
            --disable-ffplay \
            --disable-debug \
            --enable-static \
            --disable-shared \
            --extra-ldflags="-static -static-libgcc -static-libstdc++" \
            --pkg-config-flags=--static \
            --enable-filter=scale,fps,palettegen,paletteuse,subtitles \
            --enable-encoder=gif \
            --enable-muxer=gif,image2 \
            --enable-demuxer=ass,ssa,srt,vtt,webvtt,pgssub,hdmv_pgs_subtitle,dvdsub,mov_text \
            --enable-parser=ass,webvtt \
            --enable-decoder=ass,ssa,subrip,webvtt,pgssub,dvdsub,hdmv_pgs_subtitle \
            --enable-protocol=file

      - name: Build
        shell: msys2 {0}
        env:
          PKG_CONFIG: /ucrt64/bin/pkg-config
          PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
          PKG_CONFIG_LIBDIR: /ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /ucrt64
          CPPFLAGS: -I/ucrt64/include
          LDFLAGS: -L/ucrt64/lib -static -static-libgcc -static-libstdc++
          PATH: /ucrt64/bin:/usr/bin:$PATH
        run: |
          cd "$GITHUB_WORKSPACE"
          make -j"$(nproc)"

      - name: Verify output
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          ls -l ffmpeg.exe ffprobe.exe
          ./ffmpeg.exe -hide_banner -version | head -n 20
          ./ffprobe.exe -hide_banner -version | head -n 20

      - name: Release raw exe files
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        with:
          tag_name: ffmpeg-gif-win-static-${{ github.run_number }}
          name: FFmpeg Windows static GIF ${{ github.run_number }}
          files: |
            ffmpeg.exe
            ffprobe.exe
