name: FFmpeg Windows static GIF exporter build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit to build (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          suppress-deprecation-warnings: true
          install: >-
            base-devel
            git
            make
            gcc
            nasm
            pkg-config
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-libplacebo
            mingw-w64-x86_64-libwebp

      - name: Verify toolchain and libraries
        shell: msys2 {0}
        run: |
          which x86_64-w64-mingw32-gcc
          x86_64-w64-mingw32-gcc --version
          pkg-config --modversion libass
          pkg-config --modversion libplacebo
          pkg-config --modversion libwebp
          ls /mingw64/lib | grep libass || true
          ls /mingw64/lib | grep libplacebo || true
          ls /mingw64/lib | grep "libwebp.*\\.a" || true

      - name: Configure FFmpeg static build
        shell: msys2 {0}
        env:
          PKG_CONFIG: /mingw64/bin/pkg-config
          PKG_CONFIG_PATH: /mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          PKG_CONFIG_LIBDIR: /mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /mingw64
          CPPFLAGS: -I/mingw64/include
          LDFLAGS: -L/mingw64/lib -static -static-libgcc -static-libstdc++
          PATH: /mingw64/bin:/usr/bin:$PATH
        run: |
          cd "$GITHUB_WORKSPACE"
          ./configure \
            --arch=x86_64 \
            --target-os=mingw32 \
            --enable-gpl \
            --enable-libass \
            --enable-libplacebo \
            --enable-libwebp \
            --enable-ffmpeg \
            --enable-ffprobe \
            --disable-doc \
            --disable-ffplay \
            --disable-debug \
            --enable-static \
            --disable-shared \
            --extra-ldflags="-static -static-libgcc -static-libstdc++" \
            --pkg-config-flags=--static \
            --enable-filter=scale,fps,palettegen,paletteuse,subtitles,libplacebo \
            --enable-encoder=gif,webp,libwebp \
            --enable-muxer=gif,image2,webp \
            --enable-parser=ass,webvtt \
            --enable-protocol=file

      - name: Build
        shell: msys2 {0}
        env:
          PKG_CONFIG: /mingw64/bin/pkg-config
          PKG_CONFIG_PATH: /mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          PKG_CONFIG_LIBDIR: /mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /mingw64
          CPPFLAGS: -I/mingw64/include
          LDFLAGS: -L/mingw64/lib -static -static-libgcc -static-libstdc++
          PATH: /mingw64/bin:/usr/bin:$PATH
        run: |
          cd "$GITHUB_WORKSPACE"
          make -j"$(nproc)"

      - name: Verify output
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          ls -l ffmpeg.exe ffprobe.exe
          ./ffmpeg.exe -hide_banner -version | head -n 20
          ./ffprobe.exe -hide_banner -version | head -n 20
          ./ffmpeg.exe -hide_banner -encoders | grep -iE "gif|webp|libwebp" || true
          ./ffmpeg.exe -hide_banner -decoders | grep -iE "h264|hevc|vp9|av1|ass|subrip|webvtt|webp" | head -n 40 || true

      - name: Release raw exe files
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        with:
          tag_name: ffmpeg-gif-win-static-${{ github.run_number }}
          name: FFmpeg Windows static GIF ${{ github.run_number }}
          files: |
            ffmpeg.exe
            ffprobe.exe
