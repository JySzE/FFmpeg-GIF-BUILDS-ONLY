name: FFmpeg Windows GIF build with libass

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit to build (optional)"
        required: false
        default: ""

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            gcc
            make
            nasm
            pkg-config
            mingw-w64-ucrt-x86_64-libass
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-pcre2

      - name: Configure FFmpeg
        run: |
          cd "$GITHUB_WORKSPACE"
          ./configure \
            --arch=x86_64 \
            --target-os=mingw32 \
            --enable-gpl \
            --enable-libass \
            --disable-doc \
            --disable-programs \
            --disable-everything \
            --enable-ffmpeg \
            --enable-encoder=gif \
            --enable-muxer=gif,image2 \
            --enable-filter=scale,fps,palettegen,paletteuse,subtitles \
            --enable-demuxer=ass,ssa \
            --enable-parser=ass \
            --enable-protocol=file

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE"
          make -j"$(nproc)"

      - name: Verify output
        run: |
          cd "$GITHUB_WORKSPACE"
          ls -l ffmpeg.exe
          ./ffmpeg.exe -hide_banner -version | head -n 20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64-gif-libass
          path: ffmpeg.exe
