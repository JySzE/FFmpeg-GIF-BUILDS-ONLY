name: FFmpeg Windows Static Custom Build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit to build (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          suppress-deprecation-warnings: true
          install: >-
            base-devel
            git
            make
            gcc
            nasm
            pkg-config
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-libass
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-python-wheel
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja

      - name: Build static libplacebo
        shell: msys2 {0}
        env:
          PATH: /ucrt64/bin:/usr/bin:$PATH
          PKG_CONFIG: /ucrt64/bin/pkg-config
          PKG_CONFIG_PATH: /opt/libplacebo-static/lib/pkgconfig:/ucrt64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: /opt/libplacebo-static/lib/pkgconfig:/ucrt64/lib/pkgconfig
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          mkdir -p deps

          if [ ! -d deps/libplacebo/.git ]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/haasn/libplacebo.git deps/libplacebo
          else
            git -C deps/libplacebo submodule sync --recursive
            git -C deps/libplacebo submodule update --init --recursive --depth 1
          fi

          mkdir -p /opt

          if [ -d deps/libplacebo-build ]; then
            meson setup --wipe deps/libplacebo-build
          fi

          meson setup \
            deps/libplacebo-build \
            deps/libplacebo \
            --prefix /opt/libplacebo-static \
            --libdir lib \
            --buildtype release \
            -Ddefault_library=static \
            -Dshaderc=enabled \
            -Dvulkan=enabled

          meson compile -C deps/libplacebo-build
          meson install -C deps/libplacebo-build

          echo "Checking libplacebo installation"
          ls -la /opt/libplacebo-static/lib/pkgconfig || true
          test -f /opt/libplacebo-static/lib/pkgconfig/libplacebo.pc

          echo "Validating libplacebo version via pkg-config"
          PKG_CONFIG_PATH=/opt/libplacebo-static/lib/pkgconfig:/ucrt64/lib/pkgconfig \
          PKG_CONFIG_LIBDIR=/opt/libplacebo-static/lib/pkgconfig:/ucrt64/lib/pkgconfig \
          pkg-config --static --modversion libplacebo

      - name: Configure FFmpeg static build
        shell: msys2 {0}
        env:
          PKG_CONFIG: /ucrt64/bin/pkg-config
          PKG_CONFIG_PATH: /opt/libplacebo-static/lib/pkgconfig:/ucrt64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: /opt/libplacebo-static/lib/pkgconfig:/ucrt64/lib/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /
          CPPFLAGS: -I/opt/libplacebo-static/include -I/ucrt64/include
          LDFLAGS: -L/opt/libplacebo-static/lib -L/ucrt64/lib -static -static-libgcc -static-libstdc++
          PATH: /ucrt64/bin:/usr/bin:$PATH
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          echo "pkg-config debug check for libplacebo:"
          PKG_CONFIG_PATH=/opt/libplacebo-static/lib/pkgconfig:/ucrt64/lib/pkgconfig \
          PKG_CONFIG_LIBDIR=/opt/libplacebo-static/lib/pkgconfig:/ucrt64/lib/pkgconfig \
          pkg-config --debug --modversion libplacebo 2>&1 || true

          ./configure \
            --arch=x86_64 \
            --target-os=mingw32 \
            --enable-gpl \
            --enable-libass \
            --enable-libplacebo \
            --enable-libwebp \
            --enable-ffmpeg \
            --enable-ffprobe \
            --disable-doc \
            --disable-ffplay \
            --disable-debug \
            --enable-static \
            --disable-shared \
            --extra-ldflags="-static -static-libgcc -static-libstdc++" \
            --pkg-config-flags=--static \
            --enable-filter=scale,fps,palettegen,paletteuse,subtitles,libplacebo \
            --enable-encoder=gif,webp,libwebp \
            --enable-muxer=gif,image2,webp \
            --enable-parser=ass,webvtt \
            --enable-protocol=file

      - name: Build
        shell: msys2 {0}
        env:
          PKG_CONFIG: /ucrt64/bin/pkg-config
          PKG_CONFIG_PATH: /opt/libplacebo-static/lib/pkgconfig:/ucrt64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: /opt/libplacebo-static/lib/pkgconfig:/ucrt64/lib/pkgconfig
          CPPFLAGS: -I/opt/libplacebo-static/include -I/ucrt64/include
          LDFLAGS: -L/opt/libplacebo-static/lib -L/ucrt64/lib -static -static-libgcc -static-libstdc++
          PATH: /ucrt64/bin:/usr/bin:$PATH
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          make -j"$(nproc)"

      - name: Verify output
        shell: msys2 {0}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          ls -l ffmpeg.exe ffprobe.exe
          ./ffmpeg.exe -hide_banner -version | head -n 20
          ./ffmpeg.exe -hide_banner -filters | grep placebo || true

      - name: Package artifacts
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p artifacts
          zip artifacts/ffmpeg-win64-static.zip ffmpeg.exe ffprobe.exe

      - name: Release raw exe / zip files
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ffmpeg-win-static-${{ github.run_number }}
          name: FFmpeg Windows Static Build ${{ github.run_number }}
          files: |
            artifacts/ffmpeg-win64-static.zip
            ffmpeg.exe
            ffprobe.exe
