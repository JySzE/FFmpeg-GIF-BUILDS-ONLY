name: FFmpeg Windows GIF exporter build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit to build (optional)"
        required: false
        default: ""

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            make
            gcc
            nasm
            pkg-config
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-pcre2

      - name: Verify compiler and libass
        shell: msys2 {0}
        run: |
          which x86_64-w64-mingw32-gcc
          x86_64-w64-mingw32-gcc --version
          pkg-config --modversion libass

      - name: Configure FFmpeg
        shell: msys2 {0}
        env:
          PKG_CONFIG: /mingw64/bin/pkg-config
          PKG_CONFIG_PATH: /mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          PKG_CONFIG_LIBDIR: /mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          CPPFLAGS: -I/mingw64/include
          LDFLAGS: -L/mingw64/lib
          PATH: /mingw64/bin:/usr/bin:$PATH
        run: |
          cd "$GITHUB_WORKSPACE"
          ./configure \
            --arch=x86_64 \
            --target-os=mingw32 \
            --enable-gpl \
            --enable-libass \
            --enable-ffmpeg \
            --enable-ffprobe \
            --disable-doc \
            --disable-ffplay \
            --disable-debug \
            --enable-static \
            --disable-shared \
            --enable-filter=scale,fps,palettegen,paletteuse,subtitles \
            --enable-encoder=gif \
            --enable-muxer=gif,image2 \
            --enable-demuxer=ass,ssa,srt,vtt,webvtt,pgssub,hdmv_pgs_subtitle,dvdsub,mov_text \
            --enable-parser=ass,webvtt \
            --enable-decoder=ass,ssa,subrip,webvtt,pgssub,dvdsub,hdmv_pgs_subtitle \
            --enable-protocol=file

      - name: Build
        shell: msys2 {0}
        env:
          PKG_CONFIG: /mingw64/bin/pkg-config
          PKG_CONFIG_PATH: /mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          PKG_CONFIG_LIBDIR: /mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          CPPFLAGS: -I/mingw64/include
          LDFLAGS: -L/mingw64/lib
          PATH: /mingw64/bin:/usr/bin:$PATH
        run: |
          cd "$GITHUB_WORKSPACE"
          make -j"$(nproc)"

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path ffmpeg.exe,ffprobe.exe -DestinationPath ffmpeg-gif-subtitles-win64.zip -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ffmpeg-gif-win-${{ github.run_number }}
          name: FFmpeg Windows GIF ${{ github.run_number }}
          files: |
            ffmpeg-gif-subtitles-win64.zip
