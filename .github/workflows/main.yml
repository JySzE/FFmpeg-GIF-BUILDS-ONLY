name: FFmpeg Windows GIF build with libass + release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit to build (optional)"
        required: false
        default: ""

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            gcc
            make
            nasm
            pkg-config
            mingw-w64-ucrt-x86_64-libass
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-pcre2

      - name: Configure FFmpeg
        shell: msys2 {0}
        env:
          PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
          PATH: /ucrt64/bin:/usr/bin:$PATH
        run: |
          cd "$GITHUB_WORKSPACE"
          ./configure \
            --arch=x86_64 \
            --target-os=mingw32 \
            --enable-gpl \
            --enable-libass \
            --enable-ffmpeg \
            --enable-ffprobe \
            --disable-doc \
            --disable-ffplay \
            --disable-debug \
            --enable-static \
            --disable-shared \
            --enable-encoder=gif \
            --enable-muxer=gif,image2 \
            --enable-filter=scale,fps,palettegen,paletteuse,subtitles \
            --enable-demuxer=ass,ssa \
            --enable-parser=ass \
            --enable-protocol=file

      - name: Build
        shell: msys2 {0}
        env:
          PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
          PATH: /ucrt64/bin:/usr/bin:$PATH
        run: |
          cd "$GITHUB_WORKSPACE"
          make -j"$(nproc)"

      - name: Verify outputs
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          ls -l ffmpeg.exe ffprobe.exe
          ./ffmpeg.exe -hide_banner -version | head -n 20
          ./ffprobe.exe -hide_banner -version | head -n 20

      - name: Upload as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-gif-libass-${{ github.run_number }}
          name: FFmpeg Windows GIF build ${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            ffmpeg.exe
            ffprobe.exe
